<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 BT HCI Bridge — Firmware Installer</title>
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #555; margin-bottom: 2rem; }
    .release {
      margin-bottom: 1.25rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .release-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .release-tag { font-weight: 600; font-size: 1rem; }
    .release-link { font-size: 0.85rem; color: #0969da; text-decoration: none; }
    .release-link:hover { text-decoration: underline; }
    .note { font-size: 0.8rem; color: #666; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>ESP32 BT HCI Bridge</h1>
  <p class="subtitle">
    Flash firmware to an M5Stack Atom S3 Lite directly from your browser.
  </p>

  <div id="releases"></div>

  <p class="note">
    Requires Chrome or Edge (Web Serial API). Connect the device via USB before
    clicking Install.
  </p>

  <script>
    window.RELEASES = window.RELEASES || [];
    const container = document.getElementById('releases');
    if (window.RELEASES.length === 0) {
      container.innerHTML = '<p>No releases available.</p>';
    } else {
      window.RELEASES.forEach(({ tag, manifestUrl, releaseUrl }) => {
        const div = document.createElement('div');
        div.className = 'release';
        div.innerHTML = `
          <div class="release-header">
            <span class="release-tag">${tag}</span>
            <a class="release-link" href="${releaseUrl}" target="_blank" rel="noopener noreferrer">Release notes ↗</a>
          </div>
          <esp-web-install-button manifest="${manifestUrl}"></esp-web-install-button>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
